<svg xmlns="http://www.w3.org/2000/svg" width="860" height="108" viewBox="0 0 860 108" role="img" aria-label="Contribution streaks" font-family="'JetBrains Mono','Liberation Mono','DejaVu Sans Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">
<title>Contribution streaks</title>
<style>.ink{fill:#1F2328;}.muted{fill:#59636E;}.accent{fill:#9A6700;}.rule{stroke:#D1D9E0;}.bar{fill:#9A6700;}.card{fill:#FFFFFF;stroke:#D1D9E0;}@media (prefers-color-scheme: dark){.ink{fill:#E6EDF3;}.muted{fill:#8B949E;}.accent{fill:#D29922;}.rule{stroke:#30363D;}.bar{fill:#D29922;}.card{fill:#0D1117;stroke:#30363D;}}</style>
<g transform="translate(6,0)">
<text x="0.0" y="16" class="muted" font-size="10" letter-spacing="1.4">CURRENT STREAK</text>
<text x="0.0" y="62" class="accent" font-size="38" font-weight="700">0<tspan class="muted" font-size="13" font-weight="400" dx="6">days</tspan></text>
<text x="0.0" y="86" class="muted" font-size="11" font-weight="400" text-anchor="start" >— → —</text>
<line x1="259" y1="10" x2="259" y2="98" class="rule" stroke-width="1"/>
<text x="282.6666666666667" y="16" class="muted" font-size="10" letter-spacing="1.4">LONGEST STREAK</text>
<text x="282.7" y="62" class="accent" font-size="38" font-weight="700">7<tspan class="muted" font-size="13" font-weight="400" dx="6">days</tspan></text>
<text x="282.6666666666667" y="86" class="muted" font-size="11" font-weight="400" text-anchor="start" >22 Jan 2026 → 28 Jan 2026</text>
<line x1="541" y1="10" x2="541" y2="98" class="rule" stroke-width="1"/>
<text x="565.3333333333334" y="16" class="muted" font-size="10" letter-spacing="1.4">DAYS WITH COMMITS</text>
<text x="565.3" y="62" class="accent" font-size="38" font-weight="700">92<tspan class="muted" font-size="13" font-weight="400" dx="6">/ 365</tspan></text>
<text x="565.3333333333334" y="86" class="muted" font-size="11" font-weight="400" text-anchor="start" >25% of the year</text>
</g></svg>
